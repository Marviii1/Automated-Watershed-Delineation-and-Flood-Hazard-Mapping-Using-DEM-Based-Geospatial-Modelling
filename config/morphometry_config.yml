    - total_stream_length_per_order
    - mean_stream_length
    - bifurcation_ratio
  areal:
    - area
    - perimeter
    - drainage_density
    - stream_frequency
    - drainage_texture
    - form_factor
    - circularity_ratio
    - elongation_ratio
