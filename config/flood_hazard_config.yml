run_ahp_consistency_check: false
reference_raster: "data/interim/hydrology/dem_hydro_corrected.tif"
factors:
  slope:
    enabled: true
    source: "data/interim/terrain/slope_degrees.tif"
    reclassified_output: "data/processed/rasters/factor_slope_score.tif"
    weight: 0.15
    rules:
      - {min: 0, max: 2, score: 5}
      - {min: 2, max: 5, score: 4}
      - {min: 5, max: 10, score: 3}
      - {min: 10, max: 20, score: 2}
      - {min: 20, max: 90, score: 1}
  elevation:
    enabled: true
    source: "data/interim/hydrology/dem_hydro_corrected.tif"
    reclassified_output: "data/processed/rasters/factor_elevation_score.tif"
    weight: 0.10
    rules:
      - {min: -100, max: 150, score: 5}
      - {min: 150, max: 300, score: 4}
      - {min: 300, max: 500, score: 3}
      - {min: 500, max: 800, score: 2}
      - {min: 800, max: 5000, score: 1}
  flow_accumulation:
    enabled: true
    source: "data/interim/hydrology/d8_flow_accumulation_cells.tif"
    reclassified_output: "data/processed/rasters/factor_flow_accumulation_score.tif"
    weight: 0.20
    rules:
      - {min: 0, max: 100, score: 1}
      - {min: 100, max: 1000, score: 2}
      - {min: 1000, max: 5000, score: 3}
      - {min: 5000, max: 20000, score: 4}
      - {min: 20000, max: 999999999, score: 5}
  distance_to_stream:
    enabled: false
    source: "data/processed/rasters/distance_to_stream.tif"
    reclassified_output: "data/processed/rasters/factor_distance_to_stream_score.tif"
    weight: 0.15
    rules:
      - {min: 0, max: 100, score: 5}
      - {min: 100, max: 250, score: 4}
      - {min: 250, max: 500, score: 3}
      - {min: 500, max: 1000, score: 2}
      - {min: 1000, max: 999999, score: 1}
  drainage_density:
    enabled: false
    source: "data/processed/rasters/drainage_density.tif"
    reclassified_output: "data/processed/rasters/factor_drainage_density_score.tif"
    weight: 0.10
    rules:
      - {min: 0, max: 0.5, score: 1}
      - {min: 0.5, max: 1.0, score: 2}
      - {min: 1.0, max: 2.0, score: 3}
      - {min: 2.0, max: 3.5, score: 4}
      - {min: 3.5, max: 99, score: 5}
  twi:
    enabled: false
    source: "data/processed/rasters/twi.tif"
    reclassified_output: "data/processed/rasters/factor_twi_score.tif"
    weight: 0.10
    rules:
      - {min: -999, max: 4, score: 1}
      - {min: 4, max: 6, score: 2}
      - {min: 6, max: 8, score: 3}
      - {min: 8, max: 10, score: 4}
      - {min: 10, max: 999, score: 5}
  spi:
    enabled: false
    source: "data/processed/rasters/spi.tif"
    reclassified_output: "data/processed/rasters/factor_spi_score.tif"
    weight: 0.05
    rules:
      - {min: -999, max: 2, score: 1}
      - {min: 2, max: 4, score: 2}
      - {min: 4, max: 6, score: 3}
      - {min: 6, max: 8, score: 4}
      - {min: 8, max: 999, score: 5}
  lulc:
    enabled: false
    source: "data/raw/lulc/lulc.tif"
    reclassified_output: "data/processed/rasters/factor_lulc_score.tif"
    weight: 0.10
    rules:
      - {values: [1], score: 1}
      - {values: [2], score: 2}
      - {values: [3], score: 3}
      - {values: [4], score: 4}
      - {values: [5], score: 5}
  soils:
    enabled: false
    source: "data/raw/soils/soils.tif"
    reclassified_output: "data/processed/rasters/factor_soils_score.tif"
    weight: 0.05
    rules:
      - {values: [1], score: 1}
      - {values: [2], score: 2}
      - {values: [3], score: 3}
      - {values: [4], score: 4}
      - {values: [5], score: 5}
hazard_classification_breaks:
  - {min: 1.0, max: 1.8, score: 1}
  - {min: 1.8, max: 2.6, score: 2}
  - {min: 2.6, max: 3.4, score: 3}
  - {min: 3.4, max: 4.2, score: 4}
  - {min: 4.2, max: 5.0, score: 5}
hazard_labels:
  1: "Very Low"
  2: "Low"
  3: "Moderate"
  4: "High"
  5: "Very High"

